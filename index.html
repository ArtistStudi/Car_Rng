<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAR RNG — Collection réaliste</title>
<style>
:root{--bg:#090c12;--panel:#111827;--line:#29384d;--text:#edf4ff;--muted:#99a8be;--cyan:#55d8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#203654,transparent 35%),#090c12;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid #26364b;background:#0b111dcc;position:sticky;top:0}.brand{font-weight:1000;font-size:23px}.brand span{color:var(--cyan)}.wallet{background:#17243a;border:1px solid #35506b;border-radius:999px;padding:10px 14px;font-weight:900;color:#78efbd}main{max-width:1400px;margin:auto;padding:22px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.panel{background:linear-gradient(145deg,#161f30,#0d1421);border:1px solid var(--line);border-radius:22px;padding:18px}.stage{height:330px;border:1px solid #40516a;border-radius:18px;margin:14px 0;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,#202d40,#090e17)}.car-art{width:min(390px,72%);height:150px;position:relative}.car-art:before{content:"";position:absolute;left:8%;right:8%;bottom:28px;height:65px;border-radius:70px 90px 28px 32px;background:linear-gradient(135deg,var(--car-color,#55d8ff),#101827);box-shadow:0 18px 24px #0007}.car-art:after{content:"";position:absolute;left:27%;top:37px;width:38%;height:58px;border-radius:70px 80px 10px 10px;background:linear-gradient(145deg,#bce8fa,#4c6579);border:8px solid #101827}.wheel{position:absolute;bottom:13px;width:58px;height:58px;border-radius:50%;background:#090d13;border:10px solid #1d2632;z-index:2}.wheel.left{left:16%}.wheel.right{right:16%}.stage h2{margin:8px 0 4px}.stage p{color:var(--muted);margin:0}.roll{width:100%;border:0;border-radius:14px;padding:16px;font-weight:1000;background:linear-gradient(90deg,#55d8ff,#839cff);color:#07121d;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{border:1px solid var(--line);background:#141d2d;border-radius:15px;padding:14px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:20px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{position:relative;min-height:210px;border:1px solid #34465e;border-radius:17px;padding:14px;text-align:center;background:linear-gradient(145deg,#1a2638,#0b111b)}.mini-art{height:90px;position:relative;margin:8px}.mini-art:before{content:"";position:absolute;left:12%;right:12%;bottom:15px;height:42px;border-radius:50px 65px 18px 18px;background:linear-gradient(135deg,var(--mini-color,#55d8ff),#101827)}.mini-art:after{content:"";position:absolute;left:31%;top:24px;width:38%;height:32px;border-radius:40px 50px 5px 5px;background:#9eb9c8;border:5px solid #101827}.card h3{font-size:14px;margin:6px 0}.rarity{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1px}.locked{filter:saturate(.25);opacity:.65}.locked h3{color:#9aa7ba}.tabs{display:flex;gap:8px;margin:18px 0}.tab{border:1px solid var(--line);background:#131c2b;color:#aab9cd;border-radius:12px;padding:11px 15px;font-weight:850}.tab.active{background:var(--cyan);color:#09131e}.section{display:none}.section.active{display:block}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;z-index:20;background:#18263a;border:1px solid #48617e;border-radius:12px;padding:12px 16px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){.hero{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){main{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}.stats{gap:8px}.stat{padding:10px}.stat strong{font-size:17px}.stage{height:280px}}
</style></head><body>
<header><div class="brand">CAR <span>RNG</span></div><div class="wallet">$ <b id="money">500</b></div></header>
<main><div class="stats"><div class="stat"><small>Rolls</small><strong id="rolls">0</strong></div><div class="stat"><small>Découvertes</small><strong id="found">0 / 64</strong></div><div class="stat"><small>Garage</small><strong id="garage">0 / 25</strong></div><div class="stat"><small>Revenu</small><strong id="income">0 $/s</strong></div></div>
<div class="hero"><section class="panel"><h2 style="margin:0">Machine à voitures</h2><div class="stage" id="stage"><div><div class="car-art" id="art"><i class="wheel left"></i><i class="wheel right"></i></div><h2 id="carName">Prêt à roll ?</h2><p id="carRarity">Chaque voiture possède un vrai nom de modèle.</p></div></div><button class="roll" id="roll">ROLL GRATUIT</button></section><aside class="panel"><h3>Progression</h3><p>Collectionnez des modèles réels et rares.</p><p>La Limited est plus rare et plus puissante que les OG.</p></aside></div>
<nav class="tabs"><button class="tab active" data-tab="index">Index</button><button class="tab" data-tab="garage">Garage</button></nav>
<section class="section active" id="index"><div class="grid" id="indexGrid"></div></section><section class="section" id="garage"><div class="grid" id="garageGrid"></div></section></main><div class="toast" id="toast"></div>
<script>
const brandNames=['Toyota','Honda','Nissan','Volkswagen','Ford','BMW','Mercedes-Benz','Audi','Porsche','Chevrolet','Dodge','Ferrari','Lamborghini','McLaren','Bugatti','Koenigsegg','Pagani','Lotus','Maserati','Alpine','Peugeot','Renault','Alfa Romeo','Jaguar','Aston Martin','Bentley','Rolls-Royce','Lexus','Acura','Mazda','Subaru','Mitsubishi','Volvo','Polestar','MINI','Cupra','Tesla','Rimac','Lucid','GMC','Jeep','Land Rover','Range Rover','Kia','Hyundai','Genesis','Cadillac','Lincoln','Plymouth','Shelby','De Tomaso','Saleen','Spyker','Noble','Caterham','Zenvo','W Motors','SSC North America','Hennessey','Apollo','RUF','Brabus','GTA VI','LIMITED GTA VI'];
const models=['Yaris','Civic','GT-R','Golf R','Mustang','M4','AMG GT','RS6','911 Carrera','Corvette','Challenger','458 Italia','Huracán','720S','Chiron','Jesko','Zonda','Emira','MC20','A110','308 GT','Clio','Giulia','F-Type','Vantage','Continental','Spectre','LFA','NSX','RX-7','WRX STI','Evolution','XC90','2','John Cooper Works','Leon','Model S','Nevera','Air','Hummer EV','Wrangler','Defender','Range Rover Sport','EV6','Ioniq 5','G80','Escalade','Navigator','Barracuda','GT500','Pantera','S7','C8 Spyder','M600','Seven','TS1','Fenyr','Tuara','Venom F5','Intensa Emozione','CTR','800','Vice City','Nebula'];
const colors=['#b6c2cf','#66bfea','#77a7ff','#68dfaa','#ffc45c','#ff7a7a','#d58cff','#c2d9ff','#ffd56f','#ff6c5f','#b6ffea','#8de3ff','#ffcc6a','#ffd1ed','#bda7ff','#ffffff'];
const cars=[];
for(let i=0;i<64;i++){let tier=i<11?'Commun':i<24?'Peu commun':i<38?'Rare':i<48?'Épique':i<56?'Légendaire':i<60?'Mythique':i===60?'Secret':i===61?'Godly':i===62?'OG':'Limited';cars.push({id:i+1,name:brandNames[i]+' '+models[i],rarity:tier,weight:i===63?0.000000002:i===62?0.00002:i<48?100-i*.8:Math.max(.01,50-i*.7),sell:i===63?10000000000:i===62?3000000000:(i+1)*1000,color:colors[i%colors.length]})}
const colorsByRarity={Commun:'#a6b5c8','Peu commun':'#66e1a6',Rare:'#6bb9ff','Épique':'#b58aff','Légendaire':'#ffca66',Mythique:'#ff7bd1',Secret:'#ff636d',Godly:'#bfeeff',OG:'#fff2b0',Limited:'#ffe66d'};
let state={money:500,rolls:0,owned:{}};
function money(n){return Math.floor(n).toLocaleString('fr-FR')}function total(){return Object.values(state.owned).reduce((a,b)=>a+b,0)}
function render(){document.querySelector('#money').textContent=money(state.money);document.querySelector('#rolls').textContent=money(state.rolls);document.querySelector('#found').textContent=cars.filter(c=>state.owned[c.id]).length+' / 64';document.querySelector('#garage').textContent=total()+' / 25';document.querySelector('#income').textContent=money(cars.reduce((n,c)=>n+(state.owned[c.id]||0)*c.id*10,0))+' $/s';const ig=document.querySelector('#indexGrid');ig.innerHTML='';cars.forEach(c=>{const owned=!!state.owned[c.id];const d=document.createElement('article');d.className='card '+(owned?'':'locked');d.innerHTML='<div class="mini-art" style="--mini-color:'+ (owned?c.color:'#59677a')+'"></div><h3>'+ (owned?c.name:'Modèle inconnu')+'</h3><div class="rarity" style="color:'+ (owned?colorsByRarity[c.rarity]:'#738198')+'">'+ (owned?c.rarity:'Non découvert')+'</div>';ig.appendChild(d)});const gg=document.querySelector('#garageGrid');gg.innerHTML='';cars.filter(c=>state.owned[c.id]).forEach(c=>{const d=document.createElement('article');d.className='card';d.innerHTML='<div class="mini-art" style="--mini-color:'+c.color+'"></div><h3>'+c.name+'</h3><div class="rarity" style="color:'+colorsByRarity[c.rarity]+'">'+c.rarity+'</div><button class="tab" style="margin-top:10px" data-sell="'+c.id+'">Vendre '+money(c.sell)+' $</button>';gg.appendChild(d)});gg.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>sell(+b.dataset.sell))}
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
function roll(){if(total()>=25)return toast('Garage plein : vends une voiture');state.rolls++;let totalWeight=cars.reduce((n,c)=>n+c.weight,0),r=Math.random()*totalWeight,n=0,chosen=cars[0];for(const c of cars){n+=c.weight;if(r<=n){chosen=c;break}}state.owned[chosen.id]=(state.owned[chosen.id]||0)+1;document.querySelector('#art').style.setProperty('--car-color',chosen.color);document.querySelector('#carName').textContent=chosen.name;document.querySelector('#carRarity').textContent=chosen.rarity+' — modèle réel';render();toast(chosen.name+' obtenue !')}
function sell(id){const c=cars.find(x=>x.id===id);if(!c||!state.owned[id])return;state.owned[id]--;if(!state.owned[id])delete state.owned[id];state.money+=c.sell;render();toast(c.name+' vendue')}
document.querySelector('#roll').onclick=roll;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{if(!t.dataset.tab)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelector('#'+t.dataset.tab).classList.add('active')});setInterval(()=>{const n=cars.reduce((sum,c)=>sum+(state.owned[c.id]||0)*c.id*10,0);if(n){state.money+=n;render()}},1000);render();
</script></body></html>
